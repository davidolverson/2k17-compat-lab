name: test

on:
  push:
    branches:
      - main
      - work/deepseek-protocol-reconstruction
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run aggregate test suite
        run: npm test

      - name: Run Mission 4 server test suite
        working-directory: server
        run: npm test

  windows-parallel-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exercise one-command Windows smoke path
        shell: powershell
        run: .\scripts\run-parallel.ps1 -Smoke

      - name: Prove local Steam evidence discovery with synthetic fixture
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "steam-fixture"
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "steamapps\common\NBA 2K17") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "userdata\123456\385760\local") | Out-Null

          @'
          "AppState"
          {
              "appid" "385760"
              "installdir" "NBA 2K17"
          }
          '@ | Set-Content (Join-Path $fixture "steamapps\appmanifest_385760.acf") -Encoding ASCII

          [IO.File]::WriteAllBytes(
            (Join-Path $fixture "steamapps\common\NBA 2K17\NBA2K17.exe"),
            [byte[]](1,2,3,4)
          )
          [IO.File]::WriteAllBytes(
            (Join-Path $fixture "userdata\123456\385760\local\SYNC.BIN"),
            [byte[]](10,20,30,40,50)
          )

          .\scripts\discover-local-evidence.ps1 -SteamRoot $fixture -OutputPath "experiment-state\ci-discovery.json"

          $result = Get-Content "experiment-state\ci-discovery.json" -Raw | ConvertFrom-Json
          if (-not $result.clientInstalled) { throw "synthetic client was not discovered" }
          if (-not $result.syncBinFound) { throw "synthetic SYNC.BIN was not discovered" }
          if (@($result.syncBinCandidates).Count -ne 1) { throw "expected exactly one SYNC.BIN candidate" }
          if ($result.networkContacted) { throw "discovery must remain offline" }
          if (@($result.claimsPromoted).Count -ne 0) { throw "discovery promoted a protocol claim" }

      - name: Prove hash-verified directory snapshot
        shell: powershell
        run: |
          $source = Join-Path $env:RUNNER_TEMP "save-snapshot-source"
          New-Item -ItemType Directory -Force -Path (Join-Path $source "nested") | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $source "slot1.dat"), [byte[]](1,2,3,4,5))
          [IO.File]::WriteAllBytes((Join-Path $source "nested\slot2.dat"), [byte[]](9,8,7,6))

          .\scripts\snapshot-directory.ps1 -SourceDir $source -Label "ci-snapshot" -OutputRoot "experiment-state\ci-snapshots"

          $manifest = Get-ChildItem "experiment-state\ci-snapshots" -Filter manifest.json -Recurse | Select-Object -First 1
          if (-not $manifest) { throw "snapshot manifest not created" }

          $doc = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          if ($doc.fileCount -ne 2) { throw "snapshot did not preserve both files" }
          foreach ($entry in $doc.files) {
            if ($entry.sha256 -notmatch '^[0-9a-f]{64}
          }

      - name: Prove Mission 14 Granite-aware P0 wrapper
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "mission14-p0"
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null

          $payload = [Text.Encoding]::ASCII.GetBytes("synthetic-user-content")
          $header = New-Object byte[] 8
          [Text.Encoding]::ASCII.GetBytes("BNH!").CopyTo($header, 0)
          [BitConverter]::GetBytes([UInt32]$payload.Length).CopyTo($header, 4)
          $bundle = New-Object byte[] ($header.Length + $payload.Length)
          $header.CopyTo($bundle, 0)
          $payload.CopyTo($bundle, $header.Length)

          $upload = Join-Path $fixture "upload.bin"
          $returned = Join-Path $fixture "returned.bin"
          [IO.File]::WriteAllBytes($upload, $bundle)
          [IO.File]::WriteAllBytes($returned, $bundle)

          $before = Join-Path $fixture "before.log"
          $after = Join-Path $fixture "after.log"
          @'
          @ 2026-10-05 08:05:22.607 POST /Session/login?x=1 session=1
          @ 2026-10-05 08:07:22.608 POST /nba/2k17/Session/update?x=1 session=1
          '@ | Set-Content $before -Encoding ASCII
          @'
          @ 2026-10-05 08:05:22.607 POST /Session/login?x=1 session=1
          @ 2026-10-05 08:07:22.608 POST /nba/2k17/Session/update?x=1 session=1
          @ 2026-10-05 08:07:30.000 POST /nba/2k17/ParkGameStatsV3/ParkSummary?x=1 session=1
          '@ | Set-Content $after -Encoding ASCII

          $spec = Join-Path $fixture "park-experiment.json"
          @'
          {
            "hypothesis": "H3",
            "variable": {
              "name": "park-summary-profile",
              "before": "baseline",
              "after": "candidate-v1"
            },
            "serverCommit": "abcdef1",
            "clientState": "synthetic CI",
            "loadPercentBefore": 30,
            "loadPercentAfter": 30,
            "outcome": "NEW_REQUEST",
            "observation": "Synthetic integration fixture."
          }
          '@ | Set-Content $spec -Encoding ASCII

          .\scripts\run-p0-validation.ps1 -SkipTests -UserContentUpload $upload -UserContentDownload $returned -RouteLogBefore $before -RouteLogAfter $after -ParkSpec $spec -OutputDir "server\captures\ci-p0-validation"

          if (-not (Test-Path "server\captures\ci-p0-validation\upload-download-proof.json")) { throw "return proof missing" }
          if (-not (Test-Path "server\captures\ci-p0-validation\before-after.diff.json")) { throw "route diff missing" }
          if (-not (Test-Path "server\captures\ci-p0-validation\park-experiments.jsonl")) { throw "Park ledger missing" }
) { throw "invalid snapshot SHA-256" }
          }

      - name: Prove Mission 14 Granite-aware P0 wrapper
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "mission14-p0"
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null

          $payload = [Text.Encoding]::ASCII.GetBytes("synthetic-user-content")
          $header = New-Object byte[] 8
          [Text.Encoding]::ASCII.GetBytes("BNH!").CopyTo($header, 0)
          [BitConverter]::GetBytes([UInt32]$payload.Length).CopyTo($header, 4)
          $bundle = New-Object byte[] ($header.Length + $payload.Length)
          $header.CopyTo($bundle, 0)
          $payload.CopyTo($bundle, $header.Length)

          $upload = Join-Path $fixture "upload.bin"
          $returned = Join-Path $fixture "returned.bin"
          [IO.File]::WriteAllBytes($upload, $bundle)
          [IO.File]::WriteAllBytes($returned, $bundle)

          $before = Join-Path $fixture "before.log"
          $after = Join-Path $fixture "after.log"
          @'
          @ 2026-10-05 08:05:22.607 POST /Session/login?x=1 session=1
          @ 2026-10-05 08:07:22.608 POST /nba/2k17/Session/update?x=1 session=1
          '@ | Set-Content $before -Encoding ASCII
          @'
          @ 2026-10-05 08:05:22.607 POST /Session/login?x=1 session=1
          @ 2026-10-05 08:07:22.608 POST /nba/2k17/Session/update?x=1 session=1
          @ 2026-10-05 08:07:30.000 POST /nba/2k17/ParkGameStatsV3/ParkSummary?x=1 session=1
          '@ | Set-Content $after -Encoding ASCII

          $spec = Join-Path $fixture "park-experiment.json"
          @'
          {
            "hypothesis": "H3",
            "variable": {
              "name": "instrumentation-profile",
              "before": "baseline",
              "after": "debug-log"
            },
            "serverCommit": "abcdef1",
            "clientState": "synthetic CI",
            "loadPercentBefore": 30,
            "loadPercentAfter": 30,
            "outcome": "NEW_REQUEST",
            "observation": "Synthetic integration fixture."
          }
          '@ | Set-Content $spec -Encoding ASCII

          .\scripts\run-p0-validation.ps1 -SkipTests -UserContentUpload $upload -UserContentDownload $returned -RouteLogBefore $before -RouteLogAfter $after -ParkSpec $spec -OutputDir "server\captures\ci-p0-validation"

          if (-not (Test-Path "server\captures\ci-p0-validation\upload-download-proof.json")) { throw "return proof missing" }
          if (-not (Test-Path "server\captures\ci-p0-validation\before-after.diff.json")) { throw "route diff missing" }
          if (-not (Test-Path "server\captures\ci-p0-validation\park-experiments.jsonl")) { throw "Park ledger missing" }
