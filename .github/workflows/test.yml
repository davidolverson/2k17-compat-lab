name: test

on:
  push:
    branches:
      - main
      - work/deepseek-protocol-reconstruction
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run aggregate test suite
        run: npm test

      - name: Run Mission 4 server test suite
        working-directory: server
        run: npm test

  windows-parallel-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exercise one-command Windows smoke path
        shell: powershell
        run: .\scripts\run-parallel.ps1 -Smoke
